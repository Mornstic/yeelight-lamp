name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个项目优先保持轻量、本地和专注。提出建议前，请先确认它符合「局域网直连、无云依赖、无遥测」的方向。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你现在的使用场景是什么？哪里不够顺手？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 描述交互或行为即可，不要求提供实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选的，说明为什么现有方案不够好。

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 托盘与窗口
        - 亮度 / 色温 / 场景
        - 自动补光
        - 快捷键与设置
        - 设备连接与发现
        - 安装与发布
        - 文档与项目
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 我已搜索已有 Issue，确认这不是重复建议
          required: true
        - label: 我理解新功能需要符合项目的本地优先方向
          required: true
